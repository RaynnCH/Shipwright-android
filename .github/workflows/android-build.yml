name: Android Build

# Simple Android-only build: no repository secrets needed. The APK is an optimized release build signed with a
# keystore that is generated once and cached, so later builds can be installed over earlier ones.
on:
  push:
    branches: [main, "build/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv64
            abi: arm64-v8a
            artifact: soh-android-armv64-apk
    runs-on: ubuntu-24.04
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Write local.properties
        run: |
          printf "sdk.dir=%s\ncmake.dir=%s/cmake/3.31.5\n" "${ANDROID_SDK_ROOT}" "${ANDROID_SDK_ROOT}" > Android/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Android/**/*.gradle', 'Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y $(cat .github/workflows/apt-deps.txt)

      - name: Apply Android engine support
        run: |
          git -C libultraship apply --ignore-space-change ../CMake/patches/libultraship-android.patch
          git -C libultraship apply --ignore-space-change ../CMake/patches/libultraship-powervr.patch
          git -C libultraship apply --ignore-space-change ../CMake/patches/libultraship-android-fullscreen.patch
      - name: Install Android toolchain
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "ndk;27.2.12479018" "cmake;3.31.5" "platforms;android-31" "build-tools;35.0.0"
      - name: Generate soh.o2r
        run: |
          cmake -S . -B build-host-tools -G Ninja -DSOH_TOOLS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host-tools --target GenerateSohOtr --parallel
          test -s build-host-tools/soh/soh.o2r

      - name: Restore signing keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ci-release.jks
          key: ci-keystore-v1

      - name: Create signing keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore ci-release.jks -alias soh -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=SOH CI"

      - name: Build APK
        env:
          GIT_TAG: build-${{ github.run_number }}
          ABI: ${{ matrix.abi }}
        run: |
          cd Android && ./gradlew assembleRelease \
            -PsohAbis=${{ matrix.abi }} \
            -PstoreFile=$GITHUB_WORKSPACE/ci-release.jks \
            -PstorePassword=android \
            -PkeyAlias=soh \
            -PkeyPassword=android

      - name: Prepare APK
        run: |
          APK=$(find Android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" ${{ matrix.artifact }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.apk
          if-no-files-found: error
          retention-days: 14
